# cargo-deny configuration. Read by both CI (.github/workflows/security.yml) and a local `cargo deny check`.
# If adding a dependency stops here, check the reason before adding an allowance. Do not loosen it silently.

[graph]
# A build without the "sqlite" feature is also shipped, so check the dependencies of both
all-features = true

[advisories]
# Checks against the RustSec advisory database. Vulnerabilities, yanked versions, and unmaintained crates fail by
# default. When adding an exception, write the reason and a review date in a comment
ignore = []

[licenses]
# Allows only the licenses the actual dependencies use (as of 2026-11-12). A dependency with a new license fails
# here, so check that it is compatible with the distribution terms before adding it
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    # Root certificate data bundled by webpki-roots (derived from Mozilla's CA list)
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
# Dependencies with version "*" are forbidden, because what gets pulled in is not determined
wildcards = "deny"

[sources]
# Forbids dependencies from anywhere other than crates.io (other registries, git repositories).
# This stops supply chain attacks that swap the source at the point where a dependency is added
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
