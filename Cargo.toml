[package]
name = "emupersist"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"  # The highest minimum version among the dependencies (rusqlite 0.41)
description = "A proxy that persists AWS Emulator state by journaling state-changing requests and replaying them on restart"
license = "MIT OR Apache-2.0"
repository = "https://github.com/beansandroasters/emupersist"
readme = "README.md"
keywords = ["aws", "emulator", "testing", "persistence", "proxy"]
categories = ["development-tools::testing", "command-line-utilities"]

# Dependencies are kept minimal on purpose (see README.md for why). No async runtime, HTTP framework, or CLI parser.
[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
ring = "0.17"
serde_json = "1"
miniz_oxide = "0.9"
libc = "0.2"  # Only for sending and receiving SIGTERM. ring already pulls it in, so the tree does not grow
rusqlite = { version = "0.41", features = ["bundled"], optional = true }

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]

[profile.release]
strip = true
lto = true
