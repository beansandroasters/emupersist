# Security checks for dependencies and code. Runs entirely inside GitHub Actions and sends nothing to external SaaS.
#
# To keep this CI itself from becoming an attack vector, it follows these rules (record the reason when changing them).
# - Uses only official GitHub actions (actions/*, github/*), pinned to a commit SHA rather than a tag.
#   Tags can be moved later (in the 2025 tj-actions/changed-files compromise, existing tags were
#   repointed to malicious commits). Updates arrive as Dependabot PRs and are reviewed as SHA diffs
# - Removes all GITHUB_TOKEN permissions by default and adds only what each job needs
# - Does not use pull_request_target (so PRs from forks get no write permissions or secrets)
# - checkout does not leave credentials in the working tree (persist-credentials: false)
# - Does not use caches (so a cache poisoned by another job is never loaded; costs run time)
# - Pins tool versions and installs their dependencies pinned with --locked

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Runs weekly to pick up newly published advisories even when dependencies do not change (Mondays 03:17 UTC)
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny (advisories, licenses, sources, bans)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny
        # Builds from crates.io with the dependencies in cargo-deny's own Cargo.lock
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: cargo deny check
        # Configured in deny.toml. Fails if it disagrees with Cargo.lock (--locked)
        run: cargo deny --locked check

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # Uploads results to Code scanning
    strategy:
      fail-fast: false
      matrix:
        # rust: this crate's code / actions: the workflows in this directory themselves (expression injection,
        # overly broad permissions, and so on)
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
