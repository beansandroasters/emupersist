# Build and test. Prevents a Dependabot update PR from passing only the security checks while actually being broken.
# The safeguards (permissions, SHA pinning, credentials, caching) are the same as at the top of security.yml.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so that clippy and rustfmt results do not change on their own when the runner's stable updates
  # (bump it by hand)
  RUST_TOOLCHAIN: "1.93.0"
  CARGO_TERM_COLOR: never

jobs:
  lint-test:
    name: fmt, clippy, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # Uses the rustup installed on the runner (rustup verifies the signatures of what it downloads)
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features

  msrv:
    name: MSRV (Rust 1.89)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.89
        # Keep in sync with rust-version in Cargo.toml
        run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 build --locked --all-features --all-targets

  e2e:
    name: round-trip tests against aws-emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Fingerprint of the key that signs aws-emulator releases. Stops here even if the key's download source is
      # replaced
      EMULATOR_SIGNING_KEY: 98BCF336A3BE53B734E967C52E5BF49BD940F624
      EMULATOR_BASE: https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Download and verify aws-emulator
        # The download site has no version-specific paths (only LTS/latest), so the content is verified by signature:
        # both the signature must be valid and the signing key must be the key with the fingerprint above
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/emu" && cd "$RUNNER_TEMP/emu"
          curl -fsSLO "$EMULATOR_BASE/aws-emulator_amd64.deb"
          curl -fsSLO "$EMULATOR_BASE/aws-emulator_amd64.deb.sig"
          curl -fsSLo key.asc https://downloads.aws.com/keys/gpg/current.asc
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import key.asc
          gpg --batch --status-fd 1 --verify aws-emulator_amd64.deb.sig aws-emulator_amd64.deb > status.txt
          grep -q "^\[GNUPG:\] VALIDSIG $EMULATOR_SIGNING_KEY " status.txt
          dpkg-deb -x aws-emulator_amd64.deb root
          root/opt/aws-emulator/bin/aws-emulator --version
          echo "EMUPERSIST_TEST_EMULATOR=$PWD/root/opt/aws-emulator/bin/aws-emulator" >> "$GITHUB_ENV"
      - name: cargo test (e2e)
        # The tests start the emulator with -t off (no telemetry)
        run: cargo test --locked --test e2e
