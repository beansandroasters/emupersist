# Has Dependabot propose dependency and action updates as PRs.
# Proposals wait 7 days after publication (cooldown), because a freshly published version is the typical way a
# compromised version arrives.
# Security updates (fixes for known vulnerabilities) are not subject to this wait (Dependabot behavior).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
